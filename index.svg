<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
    <foreignObject width="100%" height="100%">
        <html xmlns="http://www.w3.org/1999/xhtml" lang="en">
            <head>
                <meta charset="UTF-8" />
                <title>HTML Loader</title>
                <style>
                    html, body, iframe {
                        margin: 0;
                        width: 100%;
                        height: 100%;
                        border: 0;
                        overflow: hidden;
                    }
                </style>
            </head>
            <body>
                <iframe src="./index.html"></iframe>
            </body>
        </html>
    </foreignObject>
</svg>
